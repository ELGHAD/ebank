# Port the browser used (e.g. 3000 from the Docker port mapping), taken from its Host header.
map $http_host $client_port {
    ~:(?<port>\d+)$ $port;
    default          80;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time (variable below) means Nginx still starts
    # when the backend container is down or being recreated; /api then answers 502 instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # The backend must see the origin the browser sees (host AND port): Spring compares it with the Origin
        # header of every POST, and a mismatch is rejected as a cross-origin request ("Invalid CORS request").
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;
        # Overwrite (never append to) X-Forwarded-For: a client-supplied value must not reach the backend,
        # which uses it for login throttling and the audit trail.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets can be cached for a long time
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must never be cached
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
