# Included in every location that serves the SPA (add_header is not inherited by locations that set their own).
# CSP: scripts, styles and API calls only from this origin. No inline scripts or <style> blocks exist in the app;
# React's style={{}} props are applied through the DOM (CSSOM), which style-src does not block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs on the HTTPS entry point (load balancer / CDN) of a real deployment, not on local HTTP.
