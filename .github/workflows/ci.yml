name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile, unit + PostgreSQL integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebank-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker engine available on GitHub-hosted Ubuntu runners
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: ebank-backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebank-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ebank-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test # also verifies that every test file actually ran (scripts/verify-test-run.mjs)
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ebank-backend:ci ebank-backend
      - run: docker build -t ebank-frontend:ci ebank-frontend

  e2e:
    name: End-to-end (Docker Compose stack + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate throwaway secrets for this run
        run: |
          gen() { openssl rand -hex 24; }
          {
            echo "POSTGRES_DB=ebank"
            echo "POSTGRES_USER=ebank"
            echo "POSTGRES_PASSWORD=$(gen)"
            echo "APP_DB_USER=ebank_app"
            echo "APP_DB_PASSWORD=$(gen)"
            echo "APP_JWT_SECRET=$(openssl rand -hex 32)"
            echo "APP_JWT_EXPIRATION=60m"
            echo "SPRING_PROFILES_ACTIVE=demo"
            echo "DEMO_AGENT_PASSWORD=$(gen)"
            echo "DEMO_ORG_ADMIN_PASSWORD=$(gen)"
            echo "DEMO_PLATFORM_ADMIN_PASSWORD=$(gen)"
            echo "FRONTEND_PORT=3000"
          } > .env
          # Mask them in logs, and hand the demo passwords to the test runner
          while IFS='=' read -r key value; do
            case "$key" in *PASSWORD*|*SECRET*) echo "::add-mask::$value" ;; esac
          done < .env
          {
            echo "E2E_AGENT_PASSWORD=$(grep '^DEMO_AGENT_PASSWORD=' .env | cut -d= -f2)"
            echo "E2E_ORG_ADMIN_PASSWORD=$(grep '^DEMO_ORG_ADMIN_PASSWORD=' .env | cut -d= -f2)"
            echo "E2E_PLATFORM_PASSWORD=$(grep '^DEMO_PLATFORM_ADMIN_PASSWORD=' .env | cut -d= -f2)"
          } >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 420
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            compose-logs.txt
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
