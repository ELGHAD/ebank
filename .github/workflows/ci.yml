name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile, unit + PostgreSQL integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebank-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker engine available on GitHub-hosted Ubuntu runners
      - run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend (lint, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebank-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ebank-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test # also verifies that every test file actually ran (scripts/verify-test-run.mjs)
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ebank-backend:ci ebank-backend
      - run: docker build -t ebank-frontend:ci ebank-frontend
