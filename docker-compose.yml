# Local stack: PostgreSQL + Spring Boot API + React SPA behind Nginx.
# Only the frontend is published to the host; the SPA reaches the API same-origin through Nginx (/api).
# Values come from .env (copy .env.example). Required secrets stop `docker compose up` with a clear message.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebank}
      # Schema owner: used only by Flyway migrations
      POSTGRES_USER: ${POSTGRES_USER:-ebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Restricted role the application connects with (created by the init script on first start)
      APP_DB_USER: ${APP_DB_USER:-ebank_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ebank_db_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./ebank-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ebank}
      DB_USERNAME: ${APP_DB_USER:-ebank_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      FLYWAY_USER: ${POSTGRES_USER:-ebank}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (openssl rand -hex 32)}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-60m}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DEMO_AGENT_USERNAME: ${DEMO_AGENT_USERNAME:-agent@demo.ebank.test}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-}

  frontend:
    build:
      context: ./ebank-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

volumes:
  ebank_db_data:
