# Committed configuration: no secrets here. Secrets come from environment variables
# (Docker: .env file; local development: application-local.yml, see application-local.yml.example).
spring:
  application:
    name: ebank-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema (src/main/resources/db/migration)
  flyway:
    enabled: true
    # Migrations run as the schema owner; the application itself may connect with a less privileged role
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    placeholders:
      appDbUser: ${spring.datasource.username}

server:
  shutdown: graceful
  # Behind Nginx: take the client IP from X-Forwarded-For, trusting only private-network proxies
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration: ${APP_JWT_EXPIRATION:60m}
    issuer: ebank
  cookie:
    # Browsers accept Secure cookies on http://localhost; set to false only for plain-HTTP non-localhost hosts
    secure: ${APP_COOKIE_SECURE:true}
  login-throttle:
    max-failures-per-username: 5
    max-failures-per-ip: 20
    window: 15m
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  billing:
    # Renewal job: advances billing periods and issues simulated invoices
    scheduler-enabled: true
    renewal-interval: 1h
  banking:
    default-currency: MAD
    supported-currencies: MAD,EUR,USD
  demo:
    organization-name: Demo Bank
    agent-username: ${DEMO_AGENT_USERNAME:agent@demo.ebank.test}
    agent-password: ${DEMO_AGENT_PASSWORD:}
    org-admin-username: ${DEMO_ORG_ADMIN_USERNAME:admin@demo.ebank.test}
    org-admin-password: ${DEMO_ORG_ADMIN_PASSWORD:}
    platform-admin-username: ${DEMO_PLATFORM_ADMIN_USERNAME:platform@ebank.test}
    platform-admin-password: ${DEMO_PLATFORM_ADMIN_PASSWORD:}
